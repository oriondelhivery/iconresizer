<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>App Icon Resizer</title><link rel='stylesheet' href='style.css'><link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap' rel='stylesheet'></head><body><div class='container'><div class='title-block'><h1>App Icon Resizer</h1><p class='subtitle'>One-click solution for app icon resizing</p></div><div id='drop-area' class='drop-area'>Drag and drop the app icon image or click to upload<input type='file' id='fileElem' accept='image/*'></div><p class='sizes'>Generating Sizes - 16×16, 24×24, 32×32, 36×36, 57×57, 64×64, 96×96, 114×114, 128×128, 144×144, 192×192, 256×256, 512×512, 1024×1024, 2048×2048</p><div class='custom-size-row'><label>Add custom size</label><input id='customSizeInput' type='number' placeholder='Eg: 180'></div><button id='generateBtn' class='generate-btn'>Generate Zip</button><p class='footer'>Created by Orion</p></div><script src='script.js'></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Resizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <img src="app-icon-resizer-logo.png" class="logo" alt="Logo">
        <h2 class="subtitle">One-click solution for app icon resizing</h2>

        <div id="drop-area">
            <p id="drop-text">Drag & Drop or Click to Upload</p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <p class="sizes-label">
            Generating in these sizes — 
            16x16, 24x24, 32x32, 36x36, 57x57, 64x64, 96x96, 114x114, 
            128x128, 144x144, 192x192, 256x256, 512x512, 1024x1024, 2048x2048
        </p>

        <div class="add-size-row">
            <input type="number" id="new-size" placeholder="Add size (e.g. 300)">
            <button id="add-size-btn">Add</button>
        </div>

        <button id="generate-btn">Generate Zip</button>

        <footer>
            <a href="https://www.orioncjose.com" target="_blank">Made by Orion</a>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

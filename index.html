<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Icon Resizer</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script></head>
<body>
    <div class="container">
        <img src="app-icon-resizer-logo.png" class="logo">
        <h1>App Icon Resizer</h1>
        <p class="subtitle">One-click solution for app icon resizing</p>

        <div id="drop-area">
            <p>Drag and drop the app icon image or click to upload</p>
            <input type="file" id="fileElem" accept="image/*">
        </div>

        <p class="sizes-info">Generating sizes by default. You can add more below.</p>

        <div class="custom-size-box">
            <label>Add custom size</label>
            <input type="number" id="customSizeInput" placeholder="Eg: 180">
            <button id="addSizeBtn">Add</button>
        </div>

        <button id="generateBtn" class="generate-btn">Generate Zip</button>

        <footer>
            <a href="https://www.orioncjose.com" target="_blank">Created by Orion</a>
        </footer>
    </div>

<script src="script.js"></script>
</body>
</html>

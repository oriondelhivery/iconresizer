
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Icon Resizer</title>
<style>
body {
    background:#0d0d0d;
    color:white;
    font-family: Inter, Arial, sans-serif;
    text-align:center;
    padding:40px;
}
#logo {
    width:180px;
    margin-bottom:10px;
}
#subtitle {
    font-size:20px;
    margin-bottom:30px;
    opacity:0.85;
}
#dropzone {
    border:2px dashed #444;
    background:#1a1a1a;
    padding:50px;
    margin:20px auto;
    width:350px;
    border-radius:12px;
    transition:0.2s;
}
#dropzone:hover {
    background:#222;
}
button {
    padding:12px 25px;
    margin-top:20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#ED1B36;
    color:white;
    cursor:pointer;
}
#sizes {
    margin-top:20px;
    font-size:14px;
    opacity:0.85;
}
#addSize {
    margin-top:25px;
}
input {
    padding:6px;
    border-radius:6px;
    border:none;
    margin-right:5px;
}
</style>
</head>
<body>

<img id="logo" src="app-icon-resizer-logo.png" />
<div id="subtitle">One-click solution for app icon resizing</div>

<div id="dropzone">Drop image here or click to upload</div>
<input type="file" id="fileInput" style="display:none" accept="image/*" />

<div id="sizes">Generating in these sizes — 16x16, 24x24, 32x32, 36x36, 57x57, 64x64, 96x96, 114x114, 128x128, 144x144, 192x192, 256x256, 512x512, 1024x1024, 2048x2048</div>

<div id="addSize">
    <input id="newSize" type="number" placeholder="Add size">
    <button onclick="addSize()">Add</button>
</div>

<button onclick="process()">Generate Icons</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
let uploadedFile = null;
let sizes = [16,24,32,36,57,64,96,114,128,144,192,256,512,1024,2048];

document.getElementById('dropzone').onclick = () => {
    document.getElementById('fileInput').click();
};
document.getElementById('fileInput').onchange = e => uploadedFile = e.target.files[0];

document.getElementById('dropzone').ondragover = e => e.preventDefault();
document.getElementById('dropzone').ondrop = e => {
    e.preventDefault();
    uploadedFile = e.dataTransfer.files[0];
};

function addSize() {
    const val = document.getElementById('newSize').value;
    if (!val) return;
    sizes.push(parseInt(val));
    document.getElementById('sizes').innerText =
        "Generating in these sizes — " + sizes.map(s => s+"x"+s).join(", ");
}

async function loadMask(name){
    const res = await fetch(name);
    return createImageBitmap(await res.arrayBuffer());
}

async function process() {
    if (!uploadedFile) { alert("Upload a file first"); return; }

    const zip = new JSZip();
    const img = await createImageBitmap(await uploadedFile.arrayBuffer());
    const mask = await loadMask("mask.png");
    const circMask = await loadMask("circle-mask.png");

    const squareFolder = zip.folder("square");
    const circleFolder = zip.folder("circular");

    for (const s of sizes) {
        const sq = await applyMask(img, mask, s);
        squareFolder.file("Icon-square-"+s+"x"+s+".png", sq);

        const ci = await applyMask(img, circMask, s);
        circleFolder.file("icon-circular-"+s+"x"+s+".png", ci);
    }

    const blob = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "icons.zip";
    a.click();
}

async function applyMask(img, mask, size) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const ctx = c.getContext("2d");

    ctx.drawImage(img, 0, 0, size, size);
    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(mask, 0, 0, size, size);

    return new Promise(res => c.toBlob(res));
}
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Icon Resizer</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <img src="app-icon-resizer-logo.png" class="logo" alt="logo">
    <h1>App Icon<br>Resizer</h1>
    <p class="subtitle">One-click solution for app icon resizing</p>

    <div id="drop-area" class="drop-area">
        <p id="drop-text">Drag and drop the app icon image or click to upload</p>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <p class="sizes">Generating Sizes - 16×16, 24×24, 32×32, 36×36, 57×57, 64×64, 96×96, 114×114, 128×128, 144×144, 192×192, 256×256, 512×512, 1024×1024, 2048×2048</p>

    <div class="custom-size">
        <label>Add custom size</label>
        <input id="custom-size-input" type="number" placeholder="Eg: 180">
        <button id="add-size-btn">Add</button>
    </div>

    <button id="generate-btn" class="generate-btn">Generate Zip</button>
</div>

<footer>
    <a href="https://oriondelhivery.github.io/iconresizer/" target="_blank">Created by Orion</a>
</footer>

<script src="script.js"></script>
</body>
</html>

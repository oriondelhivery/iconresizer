<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Icon Resizer — Fixed SVG Mask</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e10;--accent:#4da3ff;--muted:#9aa6b2}
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#07090a;color:#e6eef6;display:flex;align-items:flex-start;justify-content:center;padding:28px;}
.container{width:100%;max-width:980px;background:#0f1416;border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,0.6);display:grid;grid-template-columns:300px 1fr;gap:18px}
.logo{width:56px;height:56px;border-radius:8px;object-fit:contain;background:rgba(255,255,255,0.02);padding:6px}
.left{padding:8px}
#dropzone,#maskDrop{min-height:120px;border-radius:10px;border:2px dashed rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;padding:12px;background:#071018;cursor:pointer}
button{padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#041018;font-weight:700;cursor:pointer}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.preview-card{background:#071018;padding:8px;border-radius:8px;text-align:center}
.preview-card img{max-width:100%;height:auto;background:transparent}
.small{font-size:13px;color:var(--muted)}
.footer{grid-column:1/-1;text-align:center;margin-top:12px;color:var(--muted)}
.progress{height:8px;background:#081016;border-radius:8px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#73b8ff);transition:width .12s}
.sizes-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.size-chip{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.size-chip button{background:transparent;border:0;color:#ff8b8b;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <img src="logo.png" class="logo" alt="logo">
      <div><strong>Icon Resizer — Fixed</strong><div class="small">Square: SVG mask | Circular: circle crop</div></div>
    </div>

    <div>
      <label class="small">Mask (drop SVG here)</label>
      <div id="maskDrop"><div id="maskText" class="small">mask.svg (provided)</div></div>
      <input type="file" id="maskInput" accept=".svg" style="display:none">
    </div>

    <div style="margin-top:12px">
      <label class="small">Source image (drop any)</label>
      <div id="dropzone"><div id="dropText">Drop image or click to select</div></div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div style="margin-top:12px">
      <label class="small">Add size</label>
      <div style="display:flex;gap:8px">
        <input id="newSize" type="number" placeholder="e.g. 180" min="1" style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit">
        <button id="addSize">Add</button>
      </div>
      <div class="sizes-list" id="sizesList"></div>
    </div>

    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="previewBtn">Preview</button>
      <button id="downloadBtn">Generate ZIP</button>
    </div>

    <div class="progress"><i id="bar"></i></div>
    <div id="meta" class="small" style="margin-top:6px">No file selected</div>
  </div>

  <div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>Previews</strong> <span id="previewCount" class="small"></span></div>
      <div class="small">Click Preview to regenerate before download</div>
    </div>
    <div id="previewGrid" class="preview-grid" style="margin-top:12px;min-height:320px"></div>
    <div class="footer"><a href="https://www.orioncjose.com" target="_blank">made by Orion</a></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DEFAULT_SIZES = [16,24,32,36,57,64,96,128,114,144,192,256,512,1024,2048];
let sizes = Array.from(DEFAULT_SIZES);
const dropzone = document.getElementById('dropzone');
const maskDrop = document.getElementById('maskDrop');
const fileInput = document.getElementById('fileInput');
const maskInput = document.getElementById('maskInput');
const dropText = document.getElementById('dropText');
const maskText = document.getElementById('maskText');
const previewGrid = document.getElementById('previewGrid');
const sizesList = document.getElementById('sizesList');
const newSize = document.getElementById('newSize');
const addSize = document.getElementById('addSize');
const previewBtn = document.getElementById('previewBtn');
const downloadBtn = document.getElementById('downloadBtn');
const bar = document.getElementById('bar');
const meta = document.getElementById('meta');
const previewCount = document.getElementById('previewCount');

let selectedFile = null;
let maskTextContent = null;
let maskName = 'mask.svg';

function renderSizesUI(){ sizesList.innerHTML=''; sizes.sort((a,b)=>a-b).forEach(s=>{ const el=document.createElement('div'); el.className='size-chip'; el.innerHTML=`<span>${s}x${s}</span><button data-size="${s}">✕</button>`; sizesList.appendChild(el); }); }
sizesList.addEventListener('click', (e)=>{ if(e.target.tagName==='BUTTON'){ const s=parseInt(e.target.getAttribute('data-size')); sizes=sizes.filter(x=>x!==s); renderSizesUI(); }});
addSize.addEventListener('click', ()=>{ const v=parseInt(newSize.value); if(!v||v<1) return; if(!sizes.includes(v)) sizes.push(v); newSize.value=''; renderSizesUI(); });

renderSizesUI();

dropzone.addEventListener('click', ()=> fileInput.click());
dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e)=>{ e.preventDefault(); dropzone.classList.remove('dragover'); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f); });
fileInput.addEventListener('change', ()=> { const f=fileInput.files&&fileInput.files[0]; if(f) handleFile(f); });

maskDrop.addEventListener('click', ()=> maskInput.click());
maskDrop.addEventListener('dragover', (e)=>{ e.preventDefault(); maskDrop.classList.add('dragover'); });
maskDrop.addEventListener('dragleave', ()=> maskDrop.classList.remove('dragover'));
maskDrop.addEventListener('drop', (e)=>{ e.preventDefault(); maskDrop.classList.remove('dragover'); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleMaskFile(f); });
maskInput.addEventListener('change', ()=> { const f=maskInput.files&&maskInput.files[0]; if(f) handleMaskFile(f); });

function handleMaskFile(file){
  if(!file.name.toLowerCase().endsWith('.svg')){ alert('Please upload an SVG file'); return; }
  const reader=new FileReader();
  reader.onload = ()=> { maskTextContent = reader.result; maskName = file.name; maskText.textContent = maskName; };
  reader.readAsText(file);
}

function handleFile(file){
  if(!file.type || !file.type.startsWith('image/')){ alert('Please upload an image'); return; }
  selectedFile = file;
  dropText.textContent = file.name + ' (' + Math.round(file.size/1024) + 'KB)';
  meta.textContent = 'Ready — click Preview or Generate ZIP';
}

function loadImageFromFile(file){ return new Promise((resolve,reject)=>{ const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); }; img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Failed to load image')); }; img.src=url; }); }

async function loadMaskText(){ if(maskTextContent) return maskTextContent; try{ const res = await fetch('mask.svg'); if(!res.ok) throw new Error('mask.svg not found'); const txt = await res.text(); return txt; }catch(e){ return null; } }

// draw cover
function drawImageCover(ctx,img,w,h){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const ir=iw/ih, cr=w/h;
  let sx=0, sy=0, sw=iw, sh=ih;
  if(ir>cr){ sw=ih*cr; sx=(iw-sw)/2; } else { sh=iw/cr; sy=(ih-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, 0,0,w,h);
}

// FIXED: draw image first, then apply SVG mask with destination-in
async function renderSquareWithSvgMask(img, size, svgText){
  // prepare svg with width/height
  let svg = svgText;
  svg = svg.replace(/<svg([^>]*)>/, (m,attrs)=>{ if(/width=/.test(attrs)&&/height=/.test(attrs)) return '<svg'+attrs+'>'; return `<svg${attrs} width="${size}" height="${size}">`; });
  const svg64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const maskImg = new Image();
  maskImg.src = svg64;
  await new Promise((res,rej)=>{ maskImg.onload = res; maskImg.onerror = ()=> rej(new Error('Failed to load mask.svg as image')); });

  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);

  // draw source image center-cropped to cover canvas
  drawImageCover(ctx, img, size, size);

  // apply mask: keep only pixels where mask has opaque pixels
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(maskImg, 0, 0, size, size);

  // reset composite
  ctx.globalCompositeOperation = 'source-over';

  return canvas.toDataURL('image/png');
}

function renderCircular(img, size){
  const canvas=document.createElement('canvas');
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);
  drawImageCover(ctx, img, size, size);
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath();
  ctx.arc(size/2,size/2,Math.min(size,size)/2,0,Math.PI*2);
  ctx.closePath();
  ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return canvas.toDataURL('image/png');
}

previewBtn.addEventListener('click', async ()=>{
  if(!selectedFile){ alert('Select an image first'); return; }
  previewGrid.innerHTML=''; previewCount.textContent = ` — ${sizes.length} sizes`;
  const img = await loadImageFromFile(selectedFile);
  const svgText = await loadMaskText();
  if(!svgText){ alert('mask.svg not found. Upload via Mask box.'); return; }
  let count=0, total=sizes.length*2;
  for(const s of sizes){
    const sq = await renderSquareWithSvgMask(img,s,svgText);
    const circ = renderCircular(img,s);
    const card=document.createElement('div'); card.className='preview-card';
    card.innerHTML = `<div style="display:flex;gap:10px;align-items:center;justify-content:center"><div><img src="${sq}" alt="sq" style="width:96px;height:96px;border-radius:8px"></div><div><img src="${circ}" alt="circ" style="width:96px;height:96px;border-radius:50%"></div></div><div class="small">${s}x${s}</div>`;
    previewGrid.appendChild(card);
    count+=2; setProgress((count/total)*100); await new Promise(r=>setTimeout(r,60));
  }
  setProgress(0); meta.textContent='Preview ready';
});

downloadBtn.addEventListener('click', async ()=>{
  if(!selectedFile){ alert('Select an image first'); return; }
  const img = await loadImageFromFile(selectedFile);
  const svgText = await loadMaskText();
  if(!svgText){ alert('mask.svg not found. Upload via Mask box.'); return; }
  downloadBtn.disabled=true; downloadBtn.textContent='Processing...';
  const zip = new JSZip();
  const sq = zip.folder('square'); const circ = zip.folder('circular');
  let count=0, total=sizes.length*2;
  for(const s of sizes){
    const sqData = await renderSquareWithSvgMask(img,s,svgText);
    sq.file(`Icon-square-${s}x${s}.png`, sqData.split(',')[1], {base64:true});
    count++; setProgress((count/total)*100); await new Promise(r=>setTimeout(r,40));
    const circData = renderCircular(img,s);
    circ.file(`Icon-circular-${s}x${s}.png`, circData.split(',')[1], {base64:true});
    count++; setProgress((count/total)*100); await new Promise(r=>setTimeout(r,40));
  }
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='icons-with-mask.zip'; a.click();
  downloadBtn.disabled=false; downloadBtn.textContent='Generate ZIP'; meta.textContent='Done — ZIP downloaded'; setProgress(0);
});

function setProgress(p){ bar.style.width = Math.max(0,Math.min(100,p)) + '%'; }
</script>
</body>
</html>
